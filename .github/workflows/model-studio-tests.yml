name: Model Studio tests

on:
  pull_request:
    paths:
      - "Employee Portal/studio/**"
      - "tests/model-studio/**"
      - ".github/workflows/model-studio-tests.yml"
  push:
    branches: [main]
    paths:
      - "Employee Portal/studio/**"
      - "tests/model-studio/**"
      - ".github/workflows/model-studio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/model-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/model-studio/package-lock.json

      - name: Syntax-check the scripts
        working-directory: Employee Portal/studio
        run: |
          node --check js/occt-worker.js
          node --check ietm/viewer.js
          for f in js/*.js; do [ "$f" = js/occt-worker.js ] || node --input-type=module --check < "$f"; done

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "1"

      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: model-studio-playwright-report
          path: tests/model-studio/playwright-report
