<title>GALIL Knowledge Base</title>
<meta name="description" content="GALIL's internal employee knowledge base — onboarding, company rules and training materials.">

<script>
/* set the theme before the first paint, to avoid a light/dark flash.
   Falls back to the theme chosen in WorkDesk, then to the system setting. */
(function(){try{var v=localStorage.getItem("galil-kb-theme");
if(v!=="dark"&&v!=="light"){v=localStorage.getItem("galil-workdesk-theme");}
if(v!=="dark"&&v!=="light"){v=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",v);}catch(e){}})();
</script>

<style>
:root{
  --paper:#FBFDF7; --surface:#FFFFFF; --wash:#F2F8E9; --sunk:#EFF4E6;
  --ink:#1B2A18; --body:#2C3A28; --muted:#5B6B57; --faint:#8A9686;
  --line:#D8E7C4; --line-soft:#E7F0DA;
  --accent:#5C8B22; --accent-bright:#8CC63E; --accent-ink:#3F6116;
  --red:#E05C4B; --amber:#F0A32C; --blue:#3B7DD8;
  --note-bg:#EAF2FC; --note-fg:#1F4E8C; --warn-bg:#FDF3E1; --warn-fg:#7A4E07;
  --chrome-bg:#1B2A18; --chrome-fg:#EAF3E0; --chrome-fg-soft:#C4D9AE;
  --shadow:0 1px 2px rgba(27,42,24,.05), 0 8px 24px -16px rgba(27,42,24,.28);
  --sans:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11170E; --surface:#182014; --wash:#1E2818; --sunk:#141B10;
    --ink:#E9F2DF; --body:#D2DEC6; --muted:#9AAC90; --faint:#6E7F66;
    --line:#2E3C26; --line-soft:#26331F;
    --accent:#9FD154; --accent-bright:#B6E072; --accent-ink:#C6E894;
    --red:#F07E6E; --amber:#F5B84F; --blue:#7FB2F0;
    --note-bg:#15263A; --note-fg:#A9CBF3; --warn-bg:#33270F; --warn-fg:#F3CD85;
    --chrome-bg:#2B3A22; --chrome-fg:#EAF3E0; --chrome-fg-soft:#BFD4A9;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11170E; --surface:#182014; --wash:#1E2818; --sunk:#141B10;
  --ink:#E9F2DF; --body:#D2DEC6; --muted:#9AAC90; --faint:#6E7F66;
  --line:#2E3C26; --line-soft:#26331F;
  --accent:#9FD154; --accent-bright:#B6E072; --accent-ink:#C6E894;
  --red:#F07E6E; --amber:#F5B84F; --blue:#7FB2F0;
  --note-bg:#15263A; --note-fg:#A9CBF3; --warn-bg:#33270F; --warn-fg:#F3CD85;
  --chrome-bg:#2B3A22; --chrome-fg:#EAF3E0; --chrome-fg-soft:#BFD4A9;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--body);
  font-family:var(--serif); font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink); text-underline-offset:2px; text-decoration-thickness:1px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
[hidden]{display:none !important}

/* ---------- utility strip ---------- */
.utility{background:var(--chrome-bg); color:var(--chrome-fg-soft); font-family:var(--sans); font-size:12.5px}
.utility-in{max-width:1180px; margin:0 auto; padding:8px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.utility a{color:var(--chrome-fg); text-decoration:none; white-space:nowrap}
.utility a:hover{color:var(--accent-bright)}
.utility .who{margin-inline-start:auto; color:var(--chrome-fg-soft)}
.utility .who b{color:var(--chrome-fg); font-weight:600}
.themebtn{
  flex:0 0 auto; width:26px; height:26px; border-radius:999px; cursor:pointer;
  border:1px solid var(--chrome-fg-soft); background:transparent; color:var(--chrome-fg);
  display:grid; place-items:center; font-size:13px; line-height:1;
}
.themebtn:hover{border-color:var(--accent-bright); color:var(--accent-bright)}

/* ---------- masthead ---------- */
.masthead{background:#1B2A18; color:#EAF3E0; padding:30px 20px 26px; border-bottom:3px solid var(--accent)}
.masthead-in{max-width:1180px; margin:0 auto; display:flex; flex-wrap:wrap; gap:22px; align-items:flex-end}
.masthead .grow{flex:1 1 320px}
.wordmark{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.wordmark svg{width:40px; height:32px; flex:0 0 auto}
.wordmark b{font-family:var(--sans); font-weight:700; font-size:22px; letter-spacing:.16em; color:#fff; line-height:1}
.wordmark small{display:block; font-family:var(--sans); font-size:11.5px; letter-spacing:.05em; color:#A9C489; margin-top:3px}
.masthead h1{font-family:var(--sans); font-weight:600; font-size:clamp(26px,4.2vw,38px); line-height:1.08; margin:0; color:#fff; letter-spacing:-.015em}
.masthead .standfirst{font-size:15.5px; color:#B7CCA3; margin:9px 0 0; max-width:60ch}
.search{flex:1 1 280px; max-width:420px; position:relative}
.search input{
  width:100%; font-family:var(--sans); font-size:15px; padding:11px 14px 11px 38px;
  border-radius:10px; border:1px solid #33462C; background:#16210F; color:#EAF3E0;
}
.search input::placeholder{color:#8FA87A}
.search input:focus{outline:2px solid var(--accent-bright); outline-offset:1px}
.search .ic{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#8FA87A; font-family:var(--sans); pointer-events:none}

/* ---------- shell ---------- */
.shell{max-width:1180px; margin:0 auto; padding:0 20px 64px; display:grid; grid-template-columns:250px minmax(0,1fr); gap:44px; align-items:start}
.toc{position:sticky; top:0; padding-block:28px; max-height:100vh; overflow:auto; font-family:var(--sans); font-size:13.5px}
.toc h2{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin:18px 0 6px; font-weight:600}
.toc h2:first-child{margin-top:0}
.toc ul{list-style:none; margin:0; padding:0}
.toc a{display:block; padding:4px 8px; border-radius:6px; color:var(--muted); text-decoration:none; line-height:1.35}
.toc a:hover{background:var(--wash); color:var(--ink)}
.toc a.on{background:var(--wash); color:var(--ink); font-weight:600}
main{padding-block:28px; min-width:0}

/* ---------- home ---------- */
.cats{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:8px}
.cat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 18px 12px; box-shadow:var(--shadow)}
.cat .ico{font-size:22px}
.cat h2{font-family:var(--sans); font-weight:600; font-size:18px; color:var(--ink); margin:6px 0 2px}
.cat p{font-size:14.5px; color:var(--muted); margin:0 0 10px}
.cat ul{list-style:none; margin:0; padding:0; font-family:var(--sans); font-size:14px}
.cat li{border-top:1px solid var(--line-soft)}
.cat li a{display:block; padding:7px 0; text-decoration:none}
.cat li a:hover{text-decoration:underline}
.home-h{font-family:var(--sans); font-weight:600; font-size:22px; color:var(--ink); margin:0 0 4px}
.home-sub{color:var(--muted); margin:0 0 20px}

/* ---------- article ---------- */
.crumbs{font-family:var(--sans); font-size:12.5px; color:var(--faint); margin-bottom:10px}
.crumbs a{color:var(--muted); text-decoration:none}
.crumbs a:hover{color:var(--accent-ink)}
article h1{font-family:var(--sans); font-weight:600; font-size:clamp(24px,3vw,31px); line-height:1.15; color:var(--ink); margin:0 0 6px; letter-spacing:-.015em}
article .meta{font-family:var(--sans); font-size:12.5px; color:var(--faint); margin-bottom:22px}
article .lede{font-size:17.5px; color:var(--muted); margin:0 0 22px}
article > *{max-width:70ch}
article h2{font-family:var(--sans); font-weight:600; font-size:19px; color:var(--ink); margin:30px 0 8px}
article h3{font-family:var(--sans); font-weight:600; font-size:16px; color:var(--ink); margin:22px 0 6px}
article p{margin:0 0 14px}
article ul, article ol{margin:0 0 16px; padding-left:22px}
article li{margin-bottom:6px}
article li::marker{color:var(--accent)}
strong{font-weight:600; color:var(--ink)}
code{font-family:var(--mono); font-size:.87em; background:var(--sunk); padding:1px 5px; border-radius:4px; color:var(--ink)}
.steps{list-style:none; padding:0 !important; counter-reset:s}
.steps > li{counter-increment:s; position:relative; padding-left:36px; margin-bottom:10px}
.steps > li::before{
  content:counter(s); position:absolute; left:0; top:.15em; font-family:var(--mono); font-size:11.5px; font-weight:500;
  width:23px; height:23px; display:grid; place-items:center; border-radius:50%; background:var(--chrome-bg); color:var(--chrome-fg);
}
.callout{border-radius:6px; padding:12px 16px; margin:0 0 18px; font-size:15.5px; border-left:3px solid}
.callout.note{background:var(--note-bg); color:var(--note-fg); border-color:var(--blue)}
.callout.warn{background:var(--warn-bg); color:var(--warn-fg); border-color:var(--amber)}
.callout.tip{background:var(--wash); color:var(--body); border-color:var(--accent)}
.callout b{color:inherit}
table{border-collapse:collapse; width:100%; font-family:var(--sans); font-size:14px; margin:0 0 18px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line)}
th{font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600}
.pager{display:flex; justify-content:space-between; gap:12px; margin-top:40px; padding-top:18px; border-top:1px solid var(--line-soft); font-family:var(--sans); font-size:14px; flex-wrap:wrap}
.pager a{text-decoration:none}

/* ---------- search results ---------- */
.results{list-style:none; padding:0; margin:0}
.results li{padding:12px 0; border-bottom:1px solid var(--line-soft)}
.results a{font-family:var(--sans); font-weight:600; font-size:16px; text-decoration:none}
.results .c{font-family:var(--sans); font-size:12px; color:var(--faint); margin-inline-start:8px}
.results p{margin:4px 0 0; font-size:14.5px; color:var(--muted)}

/* ---------- gate ---------- */
.gate{max-width:560px; margin:60px auto; padding:0 20px; text-align:center}
.gate .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:32px 26px; box-shadow:var(--shadow)}
.gate .big{font-size:40px; line-height:1}
.gate h1{font-family:var(--sans); font-weight:600; font-size:22px; color:var(--ink); margin:12px 0 8px}
.gate p{color:var(--muted); margin:0 0 18px}
.btn{
  display:inline-block; font-family:var(--sans); font-weight:600; font-size:14.5px; padding:10px 18px; border-radius:10px;
  background:var(--accent); color:#0E1509; text-decoration:none;
}
.btn:hover{background:var(--accent-bright); color:#0E1509}

.menu-toggle{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr; gap:0}
  .toc{position:static; max-height:none; padding-block:14px 0; border-bottom:1px solid var(--line)}
  .toc nav[data-collapsed="true"]{display:none}
  .menu-toggle{
    display:block; width:100%; text-align:left; font-family:var(--sans); font-size:14px; font-weight:600;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 12px; cursor:pointer; margin-bottom:10px;
  }
  .utility .who{margin-inline-start:0}
}
@media print{ .utility,.toc,.search,.pager,.menu-toggle{display:none} .shell{display:block} }
</style>
</head>

<div class="utility">
  <div class="utility-in">
    <a href="../index.html">GALIL website</a>
    <a href="../app/index.html">← Back to WorkDesk</a>
    <a href="../handbook/index.html">WorkDesk Handbook</a>
    <span class="who" id="who"></span>
    <button type="button" class="themebtn" id="themebtn" title="Switch theme" aria-label="Switch to the dark theme">◐</button>

</div>

<header class="masthead">
  <div class="masthead-in">
    <div class="grow">
      <div class="wordmark">
        <svg viewBox="0 0 60 46" aria-hidden="true"><path d="M2 30 C10 6, 20 6, 28 24 S46 42, 58 12" fill="none" stroke="#8CC63E" stroke-width="6" stroke-linecap="round"/></svg>
        <div><b>GALIL</b><small>Employee Knowledge Base · internal</small></div>
      </div>
      <h1>Knowledge Base</h1>
      <p class="standfirst">Onboarding, company rules and step-by-step training — everything you need to work at GALIL, in one place.</p>

  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
"use strict";
/* =====================================================================
   Access control.
   The Knowledge Base is for GALIL employees only. It reads the WorkDesk
   session from this browser (same storage keys as site/app/index.html)
   and refuses External Contractors (EXT) and Viewers (VIEW).
   Like the rest of the standalone WorkDesk build, this is a client-side
   check; once WorkDesk moves to Microsoft Entra ID sign-in (see the
   README roadmap), this page should sit behind the same server-side auth.
   ===================================================================== */
var WORKDESK_DATA_KEY = "galil-workdesk-v1";
var WORKDESK_SESSION_KEY = "galil-workdesk-session";
var DENIED_ROLES = ["EXT", "VIEW"];
var ROLE_NAMES = {
  EMP: "Employee", SEN: "Senior Employee", TL: "Team Lead", PM: "Project Manager",
  OPS: "Operations Manager", FIN: "Finance", CEO: "CEO / Owner",
  EXT: "External Contractor", VIEW: "Viewer"
};

function currentUser() {
  try {
    var id = localStorage.getItem(WORKDESK_SESSION_KEY);
    if (!id) return null;
    var raw = JSON.parse(localStorage.getItem(WORKDESK_DATA_KEY) || "null");
    var users = raw && raw.data && raw.data.users ? raw.data.users : [];
    for (var i = 0; i < users.length; i++) if (users[i].id === id) return users[i];
  } catch (e) {}
  return null;
}

/* =====================================================================
   Content. Each article: id, cat, title, summary, updated, body (HTML).
   ===================================================================== */
var CATS = [
  { k: "onboarding", icon: "👋", title: "Onboarding",          desc: "Your first days and weeks at GALIL." },
  { k: "rules",      icon: "📜", title: "Company rules",       desc: "Policies every employee is expected to follow." },
  { k: "training",   icon: "🎓", title: "Training & how-to's", desc: "Step-by-step guides for the tools we use." }
];

var ARTICLES = [
/* ---------------- Onboarding ---------------- */
{ id: "welcome", cat: "onboarding", title: "Welcome to GALIL", updated: "30 Sep 2026",
  summary: "Who we are, what we do and how the company is organised.",
  body:
  '<p class="lede">Welcome aboard! This article gives you the big picture — what GALIL does, how we are organised, and where to go for help.</p>' +
  '<h2>What we do</h2>' +
  '<p>GALIL delivers technical documentation, training and instructional content for engineering and technology clients. Our work is organised around <strong>clients</strong>, their <strong>projects</strong>, and the <strong>work orders</strong> that fund them.</p>' +
  '<h2>How we are organised</h2>' +
  '<table><thead><tr><th>Role</th><th>What they do</th></tr></thead><tbody>' +
  '<tr><td>CEO / Owner</td><td>Company direction, final approvals and company settings.</td></tr>' +
  '<tr><td>Operations Manager</td><td>Runs day-to-day operations across all clients, people and master lists.</td></tr>' +
  '<tr><td>Project Manager</td><td>Owns projects, work orders, budgets and assignments.</td></tr>' +
  '<tr><td>Team Lead</td><td>Leads a team, assigns tasks and approves the team\'s time and expenses.</td></tr>' +
  '<tr><td>Senior Employee / Employee</td><td>Technical writers, trainers and specialists who deliver the work.</td></tr>' +
  '<tr><td>Finance</td><td>Budgets, invoicing, expense reimbursement and payroll inputs.</td></tr>' +
  '</tbody></table>' +
  '<h2>Who to ask</h2>' +
  '<ul><li><strong>Your Team Lead</strong> — your first stop for anything about your work, tasks and schedule.</li>' +
  '<li><strong>Operations</strong> — accounts, equipment, access and HR questions.</li>' +
  '<li><strong>Finance</strong> — expenses, reimbursements and payslips.</li></ul>' +
  '<div class="callout tip"><b>Tip:</b> Start with <a href="#/first-week">Your first week checklist</a> — it links to everything else you need.</div>'
},
{ id: "first-week", cat: "onboarding", title: "Your first week checklist", updated: "30 Sep 2026",
  summary: "Everything to set up and read during your first five working days.",
  body:
  '<p class="lede">Work through this list during your first week. Your Team Lead will check in with you at the end of the week.</p>' +
  '<h2>Day 1 — accounts and equipment</h2>' +
  '<ol class="steps">' +
  '<li>Collect your laptop and accessories from Operations and sign the equipment form.</li>' +
  '<li>Sign in to your <code>@galiltc.co.il</code> Microsoft 365 account and change the temporary password.</li>' +
  '<li>Set up multi-factor authentication — see <a href="#/mfa">Setting up multi-factor authentication</a>.</li>' +
  '<li>Install and connect the company VPN — see <a href="#/vpn">How to set up the VPN</a>.</li>' +
  '<li>Create your WorkDesk account — see <a href="#/workdesk-signin">Signing in to WorkDesk</a>.</li>' +
  '</ol>' +
  '<h2>Days 2–3 — policies</h2>' +
  '<ul><li>Read the <a href="#/code-of-conduct">Code of conduct</a>.</li>' +
  '<li>Read <a href="#/infosec">Information security &amp; acceptable use</a> and <a href="#/confidentiality">Client confidentiality</a>.</li>' +
  '<li>Read <a href="#/hours">Working hours &amp; time reporting</a> and <a href="#/leave">Vacation, sick leave &amp; holidays</a>.</li></ul>' +
  '<h2>Days 4–5 — your work</h2>' +
  '<ul><li>Meet your team and get a walkthrough of your first project from your Team Lead.</li>' +
  '<li>Log your first week of hours in WorkDesk — see <a href="#/workdesk-time">Logging your time</a>.</li>' +
  '<li>Plan next week in the Week Planner — see <a href="#/workdesk-plan">Planning your week</a>.</li></ul>' +
  '<div class="callout note"><b>Note:</b> If any account or access is missing by the end of Day 1, tell Operations straight away — don\'t wait.</div>'
},
{ id: "accounts", cat: "onboarding", title: "Accounts & systems you will use", updated: "30 Sep 2026",
  summary: "The company systems, what each is for and how you get access.",
  body:
  '<p class="lede">These are the systems you will use day to day. Operations creates your accounts before your first day.</p>' +
  '<table><thead><tr><th>System</th><th>Used for</th><th>Sign-in</th></tr></thead><tbody>' +
  '<tr><td>Microsoft 365</td><td>Email, calendar, Teams, OneDrive and SharePoint</td><td>Your <code>@galiltc.co.il</code> account + MFA</td></tr>' +
  '<tr><td>WorkDesk</td><td>Time reporting, week planning, tasks, expenses, Library</td><td>Your <code>@galiltc.co.il</code> account</td></tr>' +
  '<tr><td>Company VPN</td><td>Access to internal file servers and client environments from outside the office</td><td>Your <code>@galiltc.co.il</code> account + MFA</td></tr>' +
  '<tr><td>Knowledge Base</td><td>This site — onboarding, rules and training</td><td>Through WorkDesk</td></tr>' +
  '</tbody></table>' +
  '<h2>Requesting additional access</h2>' +
  '<p>Some projects need access to a client\'s own systems. Ask your Project Manager — they request it from the client and Operations records it. Never share your credentials with anyone, including colleagues.</p>'
},

/* ---------------- Company rules ---------------- */
{ id: "code-of-conduct", cat: "rules", title: "Code of conduct", updated: "30 Sep 2026",
  summary: "How we treat each other, our clients and the company.",
  body:
  '<p class="lede">GALIL is a small company where trust matters. Everyone is expected to follow these principles.</p>' +
  '<h2>Respect</h2>' +
  '<ul><li>Treat colleagues, clients and partners with courtesy and respect.</li>' +
  '<li>Harassment, discrimination and bullying of any kind are not tolerated.</li>' +
  '<li>Disagree about ideas, never about people.</li></ul>' +
  '<h2>Integrity</h2>' +
  '<ul><li>Report your time and expenses honestly and accurately.</li>' +
  '<li>Declare any conflict of interest to your manager — for example, outside work for a client or competitor.</li>' +
  '<li>Do not accept gifts from clients or suppliers beyond a token value without approval from Operations.</li></ul>' +
  '<h2>Raising a concern</h2>' +
  '<p>If you see something that breaks these rules, raise it with your Team Lead, Operations or the CEO. Concerns raised in good faith will never count against you.</p>'
},
{ id: "hours", cat: "rules", title: "Working hours & time reporting", updated: "30 Sep 2026",
  summary: "Standard hours, when to report time and how approvals work.",
  body:
  '<p class="lede">Accurate time reporting is how we bill clients and track budgets, so it is a core part of everyone\'s job.</p>' +
  '<h2>Standard hours</h2>' +
  '<ul><li>A full-time week is <strong>42 hours</strong>, typically Sunday to Thursday, 9 hours a day.</li>' +
  '<li>Core hours are agreed with your Team Lead; let your team know in Teams if you will be unavailable.</li></ul>' +
  '<h2>Reporting rules</h2>' +
  '<ul><li>Log your hours in WorkDesk <strong>every day</strong>, and no later than the end of the working week.</li>' +
  '<li>Report every hour against the correct client, project and work order.</li>' +
  '<li>Hours beyond your allowance on a work order need a request that your Team Lead or Project Manager approves.</li>' +
  '<li>Plan the following week in the Week Planner by Thursday.</li></ul>' +
  '<div class="callout warn"><b>Important:</b> Never log hours you did not work, and never log them against a different work order to stay under budget. Ask your Project Manager instead.</div>' +
  '<p>See <a href="#/workdesk-time">Logging your time in WorkDesk</a> for how to do it.</p>'
},
{ id: "leave", cat: "rules", title: "Vacation, sick leave & holidays", updated: "30 Sep 2026",
  summary: "How to request vacation, report sick days and plan around holidays.",
  body:
  '<p class="lede">Sick and vacation days are requested in WorkDesk and approved by your manager. See <a href="#/workdesk-leave">Requesting sick and vacation days in WorkDesk</a> for the steps.</p>' +
  '<h2>Vacation</h2>' +
  '<ol class="steps">' +
  '<li>Agree the dates with your manager, at least <strong>two weeks</strong> in advance for anything longer than two days.</li>' +
  '<li>Send a <strong>Vacation</strong> request in WorkDesk for the whole range. Your manager approves or declines it.</li>' +
  '<li>Once approved, set an out-of-office reply in Outlook and hand over any urgent work.</li>' +
  '</ol>' +
  '<h2>Sick leave</h2>' +
  '<ul><li>Tell your manager as early as possible on the day.</li>' +
  '<li>Send a <strong>Sick</strong> request in WorkDesk covering the days you are off.</li>' +
  '<li>Attach the sick-leave confirmation from the clinic or doctor\'s office to the request (PDF or photo).</li></ul>' +
  '<h2>Public holidays</h2>' +
  '<p>The office is closed on Israeli public holidays. Operations publishes the holiday calendar for the year in Teams each January, including half-days on holiday eves.</p>'
},
{ id: "expenses-policy", cat: "rules", title: "Expenses policy", updated: "30 Sep 2026",
  summary: "What you can claim, what evidence you need and how you get reimbursed.",
  body:
  '<h2>What you can claim</h2>' +
  '<ul><li>Travel to client sites (public transport, taxis when pre-approved, mileage).</li>' +
  '<li>Parking at client sites.</li>' +
  '<li>Equipment or software pre-approved by your Team Lead or Operations.</li></ul>' +
  '<h2>Rules</h2>' +
  '<ul><li>Every claim needs a receipt or invoice attached in WorkDesk.</li>' +
  '<li>Submit expenses within <strong>30 days</strong> of the date they occurred.</li>' +
  '<li>Claims are approved by your Team Lead or Project Manager, then reimbursed by Finance with the next payroll.</li></ul>' +
  '<p>See <a href="#/workdesk-expenses">Reporting expenses in WorkDesk</a> for the steps.</p>'
},
{ id: "infosec", cat: "rules", title: "Information security & acceptable use", updated: "30 Sep 2026",
  summary: "Keeping company and client data safe on every device.",
  body:
  '<p class="lede">Our clients trust us with sensitive technical information. Protecting it is everyone\'s responsibility.</p>' +
  '<h2>Devices</h2>' +
  '<ul><li>Lock your screen whenever you step away (<code>Win + L</code> / <code>Ctrl + Cmd + Q</code>).</li>' +
  '<li>Keep your laptop\'s operating system and software up to date.</li>' +
  '<li>Do not install unapproved software. Ask Operations if you need something.</li></ul>' +
  '<h2>Accounts &amp; passwords</h2>' +
  '<ul><li>Use MFA on every company account. Never share passwords or MFA codes.</li>' +
  '<li>Use a unique, long passphrase for your company account.</li></ul>' +
  '<h2>Networks</h2>' +
  '<ul><li>Always connect through the <a href="#/vpn">company VPN</a> when working outside the office, especially on public Wi-Fi.</li></ul>' +
  '<h2>Reporting an incident</h2>' +
  '<p>Lost a device? Clicked a suspicious link? Report it to Operations <strong>immediately</strong> — speed matters more than blame. See <a href="#/phishing">Spotting and reporting phishing</a>.</p>'
},
{ id: "confidentiality", cat: "rules", title: "Client confidentiality", updated: "30 Sep 2026",
  summary: "How to handle client documents, data and information.",
  body:
  '<ul><li>Client material stays in the client\'s systems or in the project\'s SharePoint site — never on personal devices or personal cloud storage.</li>' +
  '<li>Do not discuss client projects in public places or on social media.</li>' +
  '<li>Only share client material with colleagues assigned to that project.</li>' +
  '<li>When a project ends, follow the Project Manager\'s instructions for returning or deleting client data.</li></ul>' +
  '<div class="callout warn"><b>Important:</b> Many clients have their own NDA terms, which may be stricter than these rules. Your Project Manager will brief you on them.</div>'
},

/* ---------------- Training ---------------- */
{ id: "vpn", cat: "training", title: "How to set up the VPN", updated: "30 Sep 2026",
  summary: "Install the VPN client, connect for the first time and troubleshoot.",
  body:
  '<p class="lede">The company VPN gives you secure access to internal resources from home, client sites or while travelling.</p>' +
  '<div class="callout note"><b>Before you start:</b> you need your <code>@galiltc.co.il</code> account and <a href="#/mfa">MFA set up</a> on your phone.</div>' +
  '<h2>Windows</h2>' +
  '<ol class="steps">' +
  '<li>Open <strong>Company Portal</strong> from the Start menu and search for <strong>GALIL VPN</strong>.</li>' +
  '<li>Click <strong>Install</strong> and wait for the installation to finish.</li>' +
  '<li>Open the VPN client from the system tray.</li>' +
  '<li>Make sure the server address is <code>vpn.galiltc.co.il</code>.</li>' +
  '<li>Click <strong>Connect</strong> and sign in with your company email and password.</li>' +
  '<li>Approve the sign-in request in the Microsoft Authenticator app.</li>' +
  '</ol>' +
  '<h2>macOS</h2>' +
  '<ol class="steps">' +
  '<li>Open <strong>Self Service</strong> and install <strong>GALIL VPN</strong>.</li>' +
  '<li>Allow the system extension when macOS asks (System Settings → Privacy &amp; Security).</li>' +
  '<li>Open the VPN client from the menu bar, confirm the server is <code>vpn.galiltc.co.il</code>, and click <strong>Connect</strong>.</li>' +
  '<li>Sign in and approve the MFA request.</li>' +
  '</ol>' +
  '<h2>Troubleshooting</h2>' +
  '<table><thead><tr><th>Problem</th><th>Try this</th></tr></thead><tbody>' +
  '<tr><td>No MFA prompt</td><td>Open the Authenticator app manually and check for pending requests; check your phone has internet.</td></tr>' +
  '<tr><td>Connects, but internal sites don\'t load</td><td>Disconnect and reconnect; on hotel Wi-Fi, complete the hotel\'s sign-in page first.</td></tr>' +
  '<tr><td>"Authentication failed"</td><td>Check your password in Outlook on the web; if it works there, contact Operations.</td></tr>' +
  '</tbody></table>'
},
{ id: "mfa", cat: "training", title: "Setting up multi-factor authentication", updated: "30 Sep 2026",
  summary: "Protect your Microsoft 365 account with the Authenticator app.",
  body:
  '<ol class="steps">' +
  '<li>Install <strong>Microsoft Authenticator</strong> on your phone from the App Store or Google Play.</li>' +
  '<li>On your laptop, sign in to <code>https://mysignins.microsoft.com/security-info</code> with your company account.</li>' +
  '<li>Choose <strong>Add sign-in method → Authenticator app</strong> and follow the prompts.</li>' +
  '<li>Scan the QR code with the Authenticator app.</li>' +
  '<li>Approve the test notification to finish.</li>' +
  '</ol>' +
  '<div class="callout tip"><b>Tip:</b> Add a phone number as a backup method, in case you lose or replace your phone.</div>' +
  '<p>Getting a new phone? Tell Operations <strong>before</strong> you wipe the old one so they can move your MFA.</p>'
},
{ id: "workdesk-signin", cat: "training", title: "Signing in to WorkDesk", updated: "30 Sep 2026",
  summary: "Create your WorkDesk account and sign in for the first time.",
  body:
  '<p class="lede">WorkDesk is where you report time, plan your week, track tasks and submit expenses.</p>' +
  '<ol class="steps">' +
  '<li>Open WorkDesk from the link Operations sends you, or from <a href="../app/index.html">here</a>.</li>' +
  '<li>Click <strong>Create an account</strong> and use your <code>@galiltc.co.il</code> email — other domains are not accepted.</li>' +
  '<li>Choose your role (Employee, Senior Employee or Team Lead). Higher roles are assigned by Operations.</li>' +
  '<li>Complete your profile and submit. Your account is activated once Operations verifies it.</li>' +
  '<li>After activation, sign in with your password or with <strong>Sign in with Microsoft</strong>.</li>' +
  '</ol>' +
  '<p>For every screen and function, see the <a href="../handbook/index.html">WorkDesk Handbook</a>.</p>'
},
{ id: "workdesk-time", cat: "training", title: "Logging your time in WorkDesk", updated: "8 Oct 2026",
  summary: "Report hours against the right work order, every day.",
  body:
  '<ol class="steps">' +
  '<li>Open the <strong>Time Log</strong> tab.</li>' +
  '<li>Click <strong>Add entry</strong>, then choose the client, project and work order.</li>' +
  '<li>Enter the start and end time (or the duration) and a short description of what you did.</li>' +
  '<li>Save. The entry appears in your week, and the work order\'s remaining allowance updates.</li>' +
  '</ol>' +
  '<h2>Useful shortcuts</h2>' +
  '<ul><li><strong>Duplicate</strong> an entry with the ⧉ button — to the previous or next day or week, a number of days back or forward (optionally onto every working day in between), or a specific date.</li>' +
  '<li>Click a work order code anywhere in a table to copy it.</li>' +
  '<li>Click a column heading to sort the table, drag a heading to move it, or drag its edge to resize it. Use <strong>＋ Save</strong> in the row above the table to keep that layout as a view, and <strong>☆</strong> to open the table with it every time.</li>' +
  '<li>On your phone, use the running timer in the mobile layout.</li></ul>' +
  '<div class="callout note"><b>Out of allowance?</b> Use <strong>Request hours</strong> — your Team Lead or Project Manager will approve or decline it.</div>'
},
{ id: "workdesk-plan", cat: "training", title: "Planning your week in WorkDesk", updated: "30 Sep 2026",
  summary: "Use the Week Planner to plan next week's hours.",
  body:
  '<ol class="steps">' +
  '<li>Open the <strong>Week Planner</strong> tab and move to next week with the arrows.</li>' +
  '<li>For each day, add planned hours against your assigned work orders.</li>' +
  '<li>Planning to be away? Request the days as vacation in the Time Log — see <a href="#/workdesk-leave">Requesting sick and vacation days</a>.</li>' +
  '<li>Plans save automatically. Finish next week\'s plan by Thursday.</li>' +
  '</ol>'
},
{ id: "workdesk-leave", cat: "training", title: "Requesting sick and vacation days in WorkDesk", updated: "30 Sep 2026",
  summary: "Send a sick or vacation request for a date range, with a supporting document.",
  body:
  '<p class="lede">Sick and vacation days go to your manager as a request. They count once your manager approves them.</p>' +
  '<ol class="steps">' +
  '<li>Open the <strong>Time Log</strong> tab and set <strong>Type</strong> to <em>Sick</em> or <em>Vacation</em>.</li>' +
  '<li>Choose the <strong>From</strong> and <strong>To</strong> dates. <strong>Days</strong> shows the working days (Sunday to Thursday) in the range.</li>' +
  '<li>For sick leave, click the file button under <strong>Sick-leave confirmation</strong> and attach the confirmation from the clinic or doctor\'s office — a PDF or an image, up to 2 MB.</li>' +
  '<li>Add a short description and click <strong>Send request</strong>.</li>' +
  '</ol>' +
  '<p>The form shows who the request goes to — your direct manager. Until they decide, the days show as <strong>Pending</strong> and are not counted. If they decline, you\'ll see their reason on each day.</p>' +
  '<p>On the phone layout, the same fields are in the <strong>Report time</strong> sheet.</p>' +
  '<div class="callout note"><b>Note:</b> Only the CEO records sick and vacation days without a request.</div>'
},
{ id: "workdesk-expenses", cat: "training", title: "Reporting expenses in WorkDesk", updated: "30 Sep 2026",
  summary: "Submit a claim with evidence and follow it through approval.",
  body:
  '<ol class="steps">' +
  '<li>Open the <strong>Expenses</strong> tab and click <strong>New expense</strong>.</li>' +
  '<li>Choose the expense type, date, amount and the project it relates to.</li>' +
  '<li>Attach a photo or PDF of the receipt. You can replace or remove it later.</li>' +
  '<li>Submit. The claim goes to your approver; you\'ll see its status change in the list.</li>' +
  '</ol>' +
  '<p>See the <a href="#/expenses-policy">Expenses policy</a> for what you can claim.</p>'
},
{ id: "workdesk-tasks", cat: "training", title: "Working with tasks in WorkDesk", updated: "30 Sep 2026",
  summary: "Find your tasks, update their status and report time against them.",
  body:
  '<ol class="steps">' +
  '<li>Open the <strong>Tasks</strong> tab. The <strong>Mine</strong> view shows tasks assigned to you.</li>' +
  '<li>Open a task to see its description, due date and project.</li>' +
  '<li>Update the status as you go: <em>To do → In progress → Done</em>.</li>' +
  '<li>Use <strong>Report time</strong> on a task to jump to the Time Log with it selected.</li>' +
  '</ol>' +
  '<p>Overdue tasks show a red badge on the Tasks tab.</p>'
},
{ id: "phishing", cat: "training", title: "Spotting and reporting phishing", updated: "30 Sep 2026",
  summary: "Recognise suspicious emails and know what to do.",
  body:
  '<h2>Warning signs</h2>' +
  '<ul><li>Urgent requests to pay, change bank details or buy gift cards.</li>' +
  '<li>A sender address that is almost — but not quite — right.</li>' +
  '<li>Unexpected attachments or links asking you to "sign in again".</li></ul>' +
  '<h2>What to do</h2>' +
  '<ol class="steps">' +
  '<li>Don\'t click links or open attachments.</li>' +
  '<li>Use <strong>Report → Phishing</strong> in Outlook.</li>' +
  '<li>If you already clicked or entered your password, change it immediately and tell Operations.</li>' +
  '</ol>'
}
];

/* ================= rendering ================= */
function byId(id) { for (var i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].id === id) return ARTICLES[i]; return null; }
function catOf(k) { for (var i = 0; i < CATS.length; i++) if (CATS[i].k === k) return CATS[i]; return null; }
function inCat(k) { return ARTICLES.filter(function (a) { return a.cat === k; }); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function textOf(html) { var d = document.createElement("div"); d.innerHTML = html; return d.textContent || ""; }

var main = document.getElementById("main");
var nav = document.getElementById("nav");
var q = document.getElementById("q");

function renderNav(activeId) {
  nav.innerHTML = '<ul><li><a href="#/" class="' + (activeId ? "" : "on") + '">🏠 Home</a></li></ul>' +
    CATS.map(function (c) {
      return '<h2>' + esc(c.title) + '</h2><ul>' + inCat(c.k).map(function (a) {
        return '<li><a href="#/' + a.id + '" class="' + (a.id === activeId ? "on" : "") + '">' + esc(a.title) + '</a></li>';
      }).join("") + '</ul>';
    }).join("");
}

function renderHome() {
  document.title = "GALIL Knowledge Base";
  main.innerHTML = '<h2 class="home-h">Browse by topic</h2><p class="home-sub">New here? Start with <a href="#/first-week">Your first week checklist</a>.</p>' +
    '<div class="cats">' + CATS.map(function (c) {
      return '<section class="cat"><div class="ico" aria-hidden="true">' + c.icon + '</div><h2>' + esc(c.title) + '</h2><p>' + esc(c.desc) + '</p><ul>' +
        inCat(c.k).map(function (a) { return '<li><a href="#/' + a.id + '">' + esc(a.title) + '</a></li>'; }).join("") + '</ul></section>';
    }).join("") + '</div>';
  renderNav(null);
}

function renderArticle(a) {
  var list = ARTICLES, i = list.indexOf(a), prev = list[i - 1], next = list[i + 1], c = catOf(a.cat);
  document.title = a.title + " · GALIL Knowledge Base";
  main.innerHTML = '<div class="crumbs"><a href="#/">Knowledge Base</a> › ' + esc(c.title) + '</div>' +
    '<article><h1>' + esc(a.title) + '</h1><div class="meta">Last updated ' + esc(a.updated) + '</div>' + a.body + '</article>' +
    '<div class="pager">' +
      (prev ? '<a href="#/' + prev.id + '">← ' + esc(prev.title) + '</a>' : '<span></span>') +
      (next ? '<a href="#/' + next.id + '">' + esc(next.title) + ' →</a>' : '<span></span>') +
    '</div>';
  renderNav(a.id);
}

function renderSearch(term) {
  var t = term.trim().toLowerCase();
  var hits = ARTICLES.filter(function (a) {
    return (a.title + " " + a.summary + " " + textOf(a.body)).toLowerCase().indexOf(t) >= 0;
  });
  document.title = "Search · GALIL Knowledge Base";
  main.innerHTML = '<h2 class="home-h">' + hits.length + ' result' + (hits.length === 1 ? "" : "s") + ' for “' + esc(term.trim()) + '”</h2>' +
    (hits.length ? '<ul class="results">' + hits.map(function (a) {
      return '<li><a href="#/' + a.id + '">' + esc(a.title) + '</a><span class="c">' + esc(catOf(a.cat).title) + '</span><p>' + esc(a.summary) + '</p></li>';
    }).join("") + '</ul>' : '<p class="home-sub">No articles match. Try a different word, or <a href="#/">browse all topics</a>.</p>');
  renderNav(null);
}

function route() {
  var id = (location.hash || "").replace(/^#\/?/, "");
  var a = id ? byId(id) : null;
  if (q.value.trim() && !id) { renderSearch(q.value); return; }
  if (a) renderArticle(a); else renderHome();
  window.scrollTo(0, 0);
}

function renderGate(kind, user) {
  var g = document.getElementById("gate");
  var html;
  if (kind === "signin") {
    html = '<div class="big" aria-hidden="true">🔒</div><h1>Sign in to WorkDesk first</h1>' +
      '<p>The Knowledge Base is for GALIL employees. Sign in to WorkDesk with your <code>@galiltc.co.il</code> account, then open the Knowledge Base from the book button in the top bar.</p>' +
      '<a class="btn" href="../app/index.html">Go to WorkDesk</a>';
  } else {
    html = '<div class="big" aria-hidden="true">⛔</div><h1>No access</h1>' +
      '<p>The Knowledge Base is available to GALIL employees only. Your role (<strong>' + esc(ROLE_NAMES[user.role] || user.role) + '</strong>) does not include access. If you think this is a mistake, contact your GALIL point of contact.</p>' +
      '<a class="btn" href="../app/index.html">Back to WorkDesk</a>';
  }
  g.innerHTML = '<div class="card">' + html + '</div>';
  g.hidden = false;
}

(function boot() {
  var user = currentUser();
  if (!user || user.isActive === false) { renderGate("signin"); return; }
  if (DENIED_ROLES.indexOf(user.role) >= 0) { renderGate("denied", user); return; }

  document.getElementById("who").innerHTML = 'Signed in as <b>' + esc(user.fullName || user.email || "") + '</b> · ' + esc(ROLE_NAMES[user.role] || user.role);
  document.getElementById("shell").hidden = false;
  document.getElementById("searchwrap").hidden = false;

  window.addEventListener("hashchange", function () { q.value = ""; route(); });
  q.addEventListener("input", function () {
    if (q.value.trim()) { if (location.hash && location.hash !== "#/") history.replaceState(null, "", "#/"); renderSearch(q.value); }
    else route();
  });

  var toggle = document.getElementById("menutoggle");
  toggle.addEventListener("click", function () {
    var open = nav.getAttribute("data-collapsed") === "true";
    nav.setAttribute("data-collapsed", open ? "false" : "true");
    toggle.setAttribute("aria-expanded", String(open));
  });
  nav.addEventListener("click", function (e) {
    if (e.target.tagName === "A") { nav.setAttribute("data-collapsed", "true"); toggle.setAttribute("aria-expanded", "false"); }
  });

  route();
})();

/* ---- light / dark theme ---- */
(function(){
  var KEY = "galil-kb-theme";
  var btn = document.getElementById("themebtn");
  function systemDark(){ try { return window.matchMedia("(prefers-color-scheme: dark)").matches; } catch(e){ return false; } }
  function current(){ return document.documentElement.getAttribute("data-theme") || (systemDark() ? "dark" : "light"); }
  function paint(t){
    document.documentElement.setAttribute("data-theme", t);
    var dark = t === "dark";
    btn.textContent = dark ? "☀" : "◐";
    btn.setAttribute("aria-label", dark ? "Switch to the light theme" : "Switch to the dark theme");
  }
  paint(current());
  btn.addEventListener("click", function(){
    var next = current() === "dark" ? "light" : "dark";
    try { localStorage.setItem(KEY, next); } catch(e){}
    paint(next);
  });
})();
</script>
