    <script>
      /* set the theme before the first paint, to avoid a light/dark flash */
      (function () {
        try {
          var v = localStorage.getItem('galil-site-theme');
          if (v !== 'dark' && v !== 'light') {
            v = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', v);
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
